<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age & Next Birthday Calculator</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- flatpickr CSS for Date Picker -->
    <link href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f4f4f4;
            color: #333333;
            margin: 0;
            padding: 0;
        }

        .logo {
            font-size: 30px;
            font-weight: 700;
            color: #00B8A9;
            text-align: center;
            margin-top: 20px;
        }

        .container {
            margin-top: 50px;
        }

        .card {
            border-radius: 15px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
            padding: 30px;
        }

        .card-header {
            background-color: #00B8A9;
            color: white;
            border-radius: 15px 15px 0 0;
            padding: 15px;
            font-size: 24px;
            font-weight: bold;
        }

        .card-body {
            background-color: white;
            padding: 30px;
            border-radius: 0 0 15px 15px;
        }

        .btn-primary {
            background-color: #4A90E2;
            border: none;
            color: white;
            font-weight: 500;
        }

        .btn-primary:hover {
            background-color: #357ABD;
        }

        .footer {
            text-align: center;
            margin-top: 50px;
            font-size: 14px;
            color: #777;
        }

        .footer a {
            color: #00B8A9;
            text-decoration: none;
        }

        .result-section {
            margin-top: 30px;
        }

        .result-section h4 {
            font-size: 20px;
            color: #00B8A9;
        }

        .result-section p {
            font-size: 18px;
            margin: 10px 0;
        }

        .result-section .highlight {
            color: #4A90E2;
            font-weight: 600;
        }

        .countdown {
            font-size: 30px;
            font-weight: bold;
            color: #FF5733;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">Hiren Bhimani - Age & Next Birthday Calculator</div>

        <!-- Input Form Section -->
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8 col-sm-12">
                <div class="card">
                    <div class="card-header text-center">Age Calculator</div>
                    <div class="card-body">
                        <form id="age-form">
                            <div class="mb-3">
                                <label for="dob" class="form-label">Enter Your Date of Birth</label>
                                <input type="text" class="form-control" id="dob" placeholder="Select Date of Birth" required>
                            </div>
                            <div class="mb-3">
                                <button type="submit" class="btn btn-primary w-100">Calculate My Age</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Result Section -->
        <div class="result-section" id="result-section" style="display: none;">
            <div class="card">
                <div class="card-header text-center">Your Age & Next Birthday</div>
                <div class="card-body">
                    <h4>Age Details:</h4>
                    <p>Age: <span class="highlight" id="age"></span></p>
                    <p>Next Birthday: <span class="highlight" id="next-birthday"></span></p>
                    <p>Time Until Next Birthday: <span class="highlight" id="time-left"></span></p>
                    <p>Weekday of Next Birthday: <span class="highlight" id="next-birthday-weekday"></span></p>
                    <p class="countdown" id="countdown-timer">Loading...</p>
                </div>
            </div>
        </div>

        <!-- Footer Section -->
        <div class="footer">
            <p>&copy; 2024 <a href="#">Hiren Bhimani</a>. All Rights Reserved.</p>
        </div>
    </div>

    <!-- Bootstrap JS & Popper.js -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>

    <!-- flatpickr JS -->
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

    <script>
        // Initialize the flatpickr
        flatpickr("#dob", {
            dateFormat: "m/d/Y",
            altInput: true,
            altFormat: "F j, Y",
            allowInput: true,
            maxDate: "today",
        });

        // Function to update countdown
        function updateCountdown(nextBirthday) {
            const countdownElement = document.getElementById('countdown-timer');
            
            // Update the countdown every second
            setInterval(function() {
                let now = new Date();
                let timeLeft = nextBirthday - now;

                // Calculate the remaining time
                let days = Math.floor(timeLeft / (1000 * 60 * 60 * 24));
                let hours = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                let minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
                let seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);

                countdownElement.innerHTML = `${days}d ${hours}h ${minutes}m ${seconds}s`;
            }, 1000);
        }

        // Handle the form submission
        document.getElementById('age-form').addEventListener('submit', function (e) {
            e.preventDefault();
            
            let dob = document.getElementById('dob').value;
            if (!dob) {
                alert("Please select your date of birth.");
                return;
            }

            // Calculate the age and next birthday
            let birthDate = new Date(dob);
            let today = new Date();
            let nextBirthday = new Date(birthDate);
            nextBirthday.setFullYear(today.getFullYear());

            if (today > nextBirthday) {
                nextBirthday.setFullYear(today.getFullYear() + 1);
            }

            // Age calculation
            let ageInMilliseconds = today - birthDate;
            let ageDate = new Date(ageInMilliseconds);
            let years = ageDate.getUTCFullYear() - 1970;
            let months = ageDate.getUTCMonth();
            let days = ageDate.getUTCDate() - 1;

            // Next birthday details
            let nextBirthdayDate = nextBirthday.toLocaleDateString('en-US');
            let nextBirthdayWeekday = nextBirthday.toLocaleString('en-US', { weekday: 'long' });

            // Time until next birthday
            let timeLeftInMilliseconds = nextBirthday - today;
            let timeLeftDays = Math.floor(timeLeftInMilliseconds / (1000 * 60 * 60 * 24));
            let timeLeftHours = Math.floor((timeLeftInMilliseconds % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));

            // Display the result
            document.getElementById('age').textContent = `${years} Years, ${months} Months, ${days} Days`;
            document.getElementById('next-birthday').textContent = nextBirthdayDate;
            document.getElementById('time-left').textContent = `${timeLeftDays} Days, ${timeLeftHours} Hours`;
            document.getElementById('next-birthday-weekday').textContent = nextBirthdayWeekday;

            // Show result section
            document.getElementById('result-section').style.display = 'block';

            // Start countdown timer for the next birthday
            updateCountdown(nextBirthday);
        });
    </script>
</body>
</html>
